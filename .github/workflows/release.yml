# Publishes the packages in dist/ and PasTinyAsm/dist/ as a GitHub release.
# Started by hand: Actions, "Release packages", Run workflow.
name: Release packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create for the release
        required: true
        default: v2.1p.1-preview
      title:
        description: Release title
        required: true
        default: "PasTiny 2.1P Preview 2: packages"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the packages against SHA256.TXT
        run: |
          grep -E '  (dist/(TP7TINY|TINYPAS|DELPHI1)|PasTinyAsm/dist/(PASASM|PASRES))\.ZIP$' SHA256.TXT > want.txt
          test "$(wc -l < want.txt)" -eq 5
          sha256sum -c want.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes-file dist/RELEASE.md \
            dist/TP7TINY.ZIP dist/TINYPAS.ZIP PasTinyAsm/dist/PASASM.ZIP PasTinyAsm/dist/PASRES.ZIP dist/DELPHI1.ZIP
